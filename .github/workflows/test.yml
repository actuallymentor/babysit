name: Behavior regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: behavior-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux python3
          npm ci
          npm ci --prefix web

      - name: Exercise CLI, browser, bridge, and Docker sessions
        run: npm run test:all
