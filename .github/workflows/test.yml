name: Behavior regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: behavior-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Pinned agent CLIs rarely change; restore the global prefix instead of
      # reinstalling them (~1 min) on every run. Bump the key with the versions.
      - name: Cache agent CLIs
        id: agent-clis
        uses: actions/cache@v6
        with:
          path: ~/.npm-global
          key: agent-clis-${{ runner.os }}-codex-0.159.2-claude-2.1.285

      - name: Install agent CLIs
        if: steps.agent-clis.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.npm-global"
          npm install -g --prefix "$HOME/.npm-global" @openai/codex@0.159.2 @anthropic-ai/claude-code@2.1.285

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux python3 jq rsync acl
          bash src/docker/assets/install-antigravity.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          npm ci
          npm ci --prefix web

      - name: Exercise CLI, browser, bridge, and Docker sessions
        run: npm run test:all
