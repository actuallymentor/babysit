name: Docker Image

on:
  workflow_call:
    inputs:
      publish-version-tag:
        description: Publish the package version alongside latest
        required: false
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - "src/docker/assets/**"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ inputs.publish-version-tag && format('docker-release-{0}', github.sha) || 'docker-build' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: src/docker/assets
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ inputs.publish-version-tag && format('actuallymentor/babysit:{0}', steps.version.outputs.version) || 'actuallymentor/babysit:latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
