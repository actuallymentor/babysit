name: Babysit Web Image

on:
  workflow_call:
    inputs:
      push-image:
        description: Push the image to Docker Hub
        required: false
        type: boolean
        default: false
      publish-version-tag:
        description: Publish the package version alongside latest
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/web-docker.yml"
      - "Dockerfile.web"
      - "web/**"
  workflow_dispatch:
    inputs:
      publish-version-tag:
        description: Publish the package version alongside latest
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: babysit-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Test web app
        run: npm test --prefix web

      - name: Test web app in Chrome
        run: npm run test:e2e --prefix web

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: inputs.push-image == true || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push-image == true || github.event_name == 'workflow_dispatch' }}
          tags: |
            actuallymentor/babysit-web:latest
            ${{ inputs.publish-version-tag == true && format('actuallymentor/babysit-web:{0}', steps.version.outputs.version) || '' }}
          cache-from: type=gha,scope=babysit-web
          cache-to: type=gha,mode=max,scope=babysit-web,ignore-error=true
          provenance: mode=max
          sbom: true
